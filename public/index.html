<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeryCode AI">
<meta name="application-name" content="DeryCode AI">
<meta name="msapplication-TileColor" content="#0f0f14">
<meta name="msapplication-tap-highlight" content="no">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d4af37'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
<title>DeryCode AI - Web Powered</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d4af37'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{background:#0f0f14;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;-webkit-appearance:none;appearance:none}
input{font-family:inherit;-webkit-appearance:none;appearance:none}
:root{--gold:#d4af37;--gold-dark:#b8941f;--bg:#0f0f14;--bg2:#13131a;--bg3:#1a1a24;--bg4:#22222e;--text:#e8e8e8;--text2:#c8c8c8;--text3:#888;--border:rgba(255,255,255,0.06)}
.safe-top{padding-top:env(safe-area-inset-top,0)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0)}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100;min-height:52px}
.header-left{display:flex;align-items:center;gap:6px;cursor:pointer}
.header-logo{font-size:20px;font-weight:800;white-space:nowrap}
.header-logo .d{color:var(--gold)}.header-logo .a{color:var(--text)}
.header-badge{font-size:11px;font-weight:700;padding:3px 8px;background:rgba(212,175,55,0.15);color:var(--gold);border-radius:4px}
.header-right{display:flex;gap:6px;align-items:center}
.lang-select{background:var(--bg4);border:1px solid rgba(255,255,255,0.08);color:var(--text3);font-size:14px;padding:7px 10px;border-radius:6px;cursor:pointer;outline:none}
.lang-select:active{border-color:var(--gold)}

/* Mode Bar */
.mode-bar{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border-bottom:1px solid var(--border);scrollbar-width:none}
.mode-bar::-webkit-scrollbar{display:none}
.mode-btn{display:flex;align-items:center;gap:6px;padding:8px 18px;background:var(--bg4);border:1px solid rgba(255,255,255,0.06);border-radius:22px;color:var(--text3);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;white-space:nowrap;flex-shrink:0}
.mode-btn .mi{font-size:17px}
.mode-btn.active{background:rgba(212,175,55,0.15);color:var(--gold);border-color:rgba(212,175,55,0.3)}
.mode-btn:active{transform:scale(0.95)}

/* Chat */
.chat-container{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;max-width:680px;width:100%;margin:0 auto;scrollbar-width:thin}
.welcome{text-align:center;padding:36px 16px}
.welcome-logo{font-size:36px;font-weight:800;margin-bottom:10px}
.welcome-logo .d{color:var(--gold)}.welcome-logo .a{color:var(--text)}
.welcome-sub{color:var(--text3);font-size:16px;margin-bottom:24px}
.welcome-features{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.welcome-feature{padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:18px;color:var(--text3);font-size:14px;font-weight:600}
.welcome-feature span{color:var(--gold);font-weight:600}
.suggest-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:520px;margin:0 auto}
.suggest-card{padding:18px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:all 0.15s;text-align:left}
.suggest-card:active{transform:scale(0.97);background:var(--bg4)}
.suggest-card-icon{font-size:24px;margin-bottom:8px}
.suggest-card-text{color:var(--text2);font-size:15px;line-height:1.4;font-weight:500}

/* Messages */
.msg{margin-bottom:16px;animation:fadeIn 0.25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .bubble{background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.2);border-radius:14px 14px 4px 14px;padding:14px 18px;max-width:85%;color:var(--text);font-size:17px;font-weight:500;line-height:1.55;word-wrap:break-word;overflow-wrap:break-word}
.msg-ai{display:flex;gap:10px;align-items:flex-start}
.ai-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--bg);flex-shrink:0}
.ai-bubble{flex:1;min-width:0}
.ai-name{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.confidence-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase}
.confidence-high{background:rgba(76,175,80,0.2);color:#4caf50;border:1px solid rgba(76,175,80,0.3)}
.confidence-medium{background:rgba(255,193,7,0.2);color:#ffc107;border:1px solid rgba(255,193,7,0.3)}
.confidence-low{background:rgba(255,152,0,0.2);color:#ff9800;border:1px solid rgba(255,152,0,0.3)}
.confidence-none{background:rgba(244,67,54,0.2);color:#f44336;border:1px solid rgba(244,67,54,0.3)}
.confidence-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.ai-content{color:#e0e0e0;font-size:17px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;font-weight:400}
.ai-sources{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.ai-source{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-source:active{background:var(--bg4);color:var(--gold)}
.ai-followups{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ai-followup{padding:10px 14px;background:var(--bg3);border:1px solid rgba(212,175,55,0.12);border-radius:10px;color:var(--text2);font-size:15px;font-weight:500;cursor:pointer;transition:all 0.15s;text-align:left}
.ai-followup:active{background:var(--bg4);color:var(--gold);transform:scale(0.98)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing span{width:7px;height:7px;background:var(--gold);border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-6px);opacity:1}}

/* Web Results */
.search-section{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.search-section-title{font-size:14px;color:#777;margin-bottom:12px;font-weight:600}
.result-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.result-card:active{border-color:rgba(212,175,55,0.2)}
.result-meta{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap}
.engine-badge{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase}
.result-url{color:#777;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;font-weight:500}
.result-title{display:block;color:var(--gold);font-size:18px;font-weight:700;margin-bottom:5px;line-height:1.35}
.result-title:active{text-decoration:underline}
.result-content{color:#aaa;font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Image Results */
.image-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media(min-width:480px){.image-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:640px){.image-grid{grid-template-columns:repeat(4,1fr)}}
.image-card{position:relative;border-radius:10px;overflow:hidden;background:var(--bg3);border:1px solid var(--border);aspect-ratio:1;cursor:pointer}
.image-card:active{transform:scale(0.97)}
.image-card img{width:100%;height:100%;object-fit:cover;display:block}
.image-card .img-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.85));padding:22px 10px 8px;font-size:12px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.image-card .img-source{position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;color:var(--gold)}
.image-placeholder{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--text3);font-size:24px}

/* News Results */
.news-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.news-card:active{border-color:rgba(212,175,55,0.2)}
.news-source{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.news-source-name{color:var(--gold);font-size:14px;font-weight:700}
.news-date{color:#777;font-size:13px}
.news-title{color:var(--text);font-size:18px;font-weight:700;line-height:1.35;margin-bottom:6px}
.news-title:active{color:var(--gold)}
.news-desc{color:#aaa;font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Code Results */
.code-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.code-card:active{border-color:rgba(212,175,55,0.2)}
.code-header{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.code-lang{padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(212,175,55,0.15);color:var(--gold)}
.code-stars{color:#e8a627;font-size:13px;font-weight:600}
.code-title{color:var(--gold);font-size:17px;font-weight:700;margin-bottom:5px;display:block;line-height:1.35}
.code-title:active{text-decoration:underline}
.code-desc{color:#aaa;font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Video Results */
.video-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.video-card{display:flex;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer}
.video-card:active{transform:scale(0.98);border-color:rgba(212,175,55,0.2)}
.video-thumb{position:relative;width:140px;min-width:140px;height:80px;background:var(--bg4);overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vid-duration{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.8);padding:2px 5px;border-radius:3px;font-size:10px;color:#fff;font-weight:600}
.video-info{flex:1;padding:8px 10px;min-width:0}
.video-title{color:var(--text);font-size:16px;font-weight:700;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.video-channel{color:var(--gold);font-size:13px;font-weight:700}
.video-views{color:#777;font-size:13px}
.video-date{color:#666;font-size:13px}
.image-placeholder{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--text3);font-size:24px}


/* Install Prompt */
.install-banner{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--bg);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;display:none;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(212,175,55,0.4);z-index:200;animation:slideUp 0.3s ease}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.install-banner:active{transform:translateX(-50%) scale(0.95)}
.install-banner .ib-icon{font-size:18px}
.install-banner .ib-close{background:rgba(0,0,0,0.2);border:none;border-radius:50%;width:20px;height:20px;color:inherit;font-size:14px;cursor:pointer;margin-left:4px}
@media(display-mode:standalone){.install-banner{display:none !important}}
.word-counter{position:absolute;right:50px;top:-18px;font-size:10px;color:#555;pointer-events:none}
.word-warn{color:#e85d3a !important}

/* Input */
.input-area{padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));border-top:1px solid var(--border);background:var(--bg2)}
.input-wrapper{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.input-box{flex:1;display:flex;align-items:center;background:var(--bg4);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:8px 12px;gap:6px;transition:border-color 0.15s;position:relative}
.input-box:focus-within{border-color:rgba(212,175,55,0.5)}
.input-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;min-width:0}
.input-box input::placeholder{color:#555560}
.voice-btn{background:transparent;border:1px solid rgba(212,175,55,0.2);border-radius:8px;padding:8px;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.voice-btn:active{background:rgba(212,175,55,0.1)}
.send-btn{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--bg);border:none;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;transition:opacity 0.15s}
.send-btn:active{opacity:0.8}
.send-btn:disabled{opacity:0.4}
.input-hint{text-align:center;color:#555;font-size:10px;margin-top:6px}
/* Mobile responsive - all screen sizes */
@media(max-width:430px){
html{font-size:16px}
.header{padding:8px 10px;min-height:48px}
.header-logo{font-size:18px}
.header-badge{font-size:10px;padding:2px 6px}
.lang-select{font-size:13px;padding:6px 8px}
.mode-bar{padding:6px 10px;gap:4px}
.mode-btn{padding:7px 14px;font-size:13px}
.mode-btn .mi{font-size:15px}
.chat-container{padding:10px}
.welcome{padding:24px 12px}
.welcome-logo{font-size:30px}
.welcome-sub{font-size:14px;margin-bottom:18px}
.welcome-feature{padding:6px 12px;font-size:12px}
.suggest-cards{grid-template-columns:repeat(2,1fr);gap:8px;max-width:100%}
.suggest-card{padding:14px}
.suggest-card-icon{font-size:20px}
.suggest-card-text{font-size:13px}
.msg-user .bubble{font-size:15px;padding:12px 14px;max-width:90%}
.ai-avatar{width:32px;height:32px;font-size:12px}
.ai-name{font-size:14px}
.ai-content{font-size:15px;line-height:1.6}
.ai-source{font-size:12px;padding:4px 8px}
.ai-followup{padding:9px 12px;font-size:14px}
.result-card{padding:12px 14px}
.result-title{font-size:16px}
.result-content{font-size:14px}
.result-url{font-size:12px;max-width:160px}
.engine-badge{font-size:10px;padding:2px 6px}
.image-grid{grid-template-columns:repeat(2,1fr);gap:6px}
.image-card .img-overlay{font-size:11px;padding:18px 8px 6px}
.image-card .img-source{font-size:10px}
.news-card{padding:14px}
.news-title{font-size:16px}
.news-desc{font-size:14px}
.code-card{padding:12px 14px}
.code-title{font-size:15px}
.code-desc{font-size:13px}
.video-card{gap:8px}
.video-thumb{width:120px;min-width:120px;height:70px}
.video-title{font-size:14px}
.video-channel{font-size:12px}
.video-views{font-size:12px}
.video-date{font-size:12px}
.vid-duration{font-size:9px;padding:1px 4px}
.input-area{padding:8px 10px}
.input-box{padding:10px 12px}
#input{font-size:15px}
.send-btn{font-size:12px;padding:8px 12px}
.input-hint{font-size:10px}
.install-banner{font-size:13px;padding:6px 12px}
}

@media(max-width:360px){
html{font-size:15px}
.header-logo{font-size:16px}
.header-badge{display:none}
.mode-btn{padding:6px 10px;font-size:12px;gap:4px}
.mode-btn .mi{font-size:14px}
.chat-container{padding:8px}
.welcome{padding:20px 10px}
.welcome-logo{font-size:26px}
.welcome-sub{font-size:13px}
.welcome-features{gap:6px}
.welcome-feature{padding:5px 10px;font-size:11px}
.suggest-cards{grid-template-columns:1fr;gap:8px}
.suggest-card{padding:12px}
.suggest-card-icon{font-size:18px}
.suggest-card-text{font-size:13px}
.msg-user .bubble{font-size:14px;padding:10px 12px;max-width:93%}
.ai-avatar{width:28px;height:28px;font-size:11px}
.ai-name{font-size:13px}
.ai-content{font-size:14px;line-height:1.55}
.ai-source{font-size:11px;padding:3px 7px}
.ai-followup{padding:8px 10px;font-size:13px}
.result-card{padding:10px 12px}
.result-title{font-size:15px}
.result-content{font-size:13px}
.result-url{font-size:11px;max-width:130px}
.engine-badge{font-size:9px;padding:2px 5px}
.video-card{flex-direction:column}
.video-thumb{width:100%;min-width:100%;height:auto;aspect-ratio:16/9}
.video-info{padding:8px 10px}
.video-title{font-size:13px}
.video-channel{font-size:11px}
.video-views{font-size:11px}
.video-date{font-size:11px}
.input-box{padding:8px 10px}
#input{font-size:14px}
.send-btn{font-size:11px;padding:7px 10px}
}

@media(max-width:320px){
html{font-size:14px}
.header{padding:6px 8px}
.header-logo{font-size:14px}
.lang-select{font-size:11px;padding:5px 6px}
.mode-btn{padding:5px 8px;font-size:11px}
.mode-btn .mi{font-size:13px}
.chat-container{padding:6px}
.welcome-logo{font-size:22px}
.welcome-sub{font-size:12px}
.welcome-feature{padding:4px 8px;font-size:10px}
.suggest-card{padding:10px}
.suggest-card-icon{font-size:16px}
.suggest-card-text{font-size:12px}
.msg-user .bubble{font-size:13px;padding:8px 10px}
.ai-avatar{width:26px;height:26px;font-size:10px}
.ai-content{font-size:13px}
.result-title{font-size:14px}
.result-content{font-size:12px}
.video-thumb{width:90px;min-width:90px;height:52px}
.video-title{font-size:12px}
.video-card{gap:6px}
#input{font-size:13px}
.send-btn{font-size:10px;padding:6px 8px}
}
</style>
</head>
<body>

<div class="header safe-top">
<div class="header-left" onclick="location.reload()">
<span class="header-logo"><span class="d">Dery</span><span class="a">Code</span></span>
<span class="header-badge">AI</span>
</div>
<div class="header-right">
<select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
<option value="en">English</option>
<option value="sw">Kiswahili</option>
<option value="lg">Luganda</option>
<option value="rn">Runyoro</option>
<option value="luo">Dholuo</option>
<option value="te">Ateso</option>
</select>
</div>
</div>

<div class="mode-bar" id="modeBar">
<button class="mode-btn active" id="mode-search" onclick="setMode('search')"><span class="mi">🔍</span> Web</button>
<button class="mode-btn" id="mode-images" onclick="setMode('images')"><span class="mi">🖼️</span> Images</button>

</div>

</div>

<script>
var mode='search';var messages=[];var busy=false;
var lang='en';var maxWords=30;
var inputEl=document.getElementById('input');
var sendBtn=document.getElementById('send');
var chatEl=document.getElementById('chat');
var welcomeEl=document.getElementById('welcome');
var langLabels={
en:{placeholder:'Ask DeryCode AI anything...',sub:'Web-powered AI search. 5 modes. Current info.',hint:'Web AI - 5 Modes - No tracking',send:'Send',search:'Search the web',images:'Search images',news:'Search news',code:'Search code',ai:'AI',
suggests:[{icon:'💼',text:'What services does DeryCode offer?'},{icon:'👤',text:'Who is Asiimwe Derick?'},{icon:'💰',text:'How much does a website cost?'},{icon:'🌍',text:'Tell me about Uganda'}]},
sw:{placeholder:'Uliza DeryCode AI chochote...',sub:'Msaidizi wako wa AI. Uliza chochote.',hint:'Web AI - Lugha 6 - Hakuna ufuatiliaji',send:'Tuma',search:'Tafuta mtandao',images:'Tafuta picha',news:'Tafuta habari',code:'Tafuta code',ai:'AI',
suggests:[{icon:'💼',text:'Huduma gani anazitoa DeryCode?'},{icon:'👤',text:'Ni nani Asiimwe Derick?'},{icon:'💰',text:'Bei ya tovuti ni ngapi?'},{icon:'🌍',text:'Niambie kuhusu Uganda'}]},
lg:{placeholder:'Buuza DeryCode AI kyonna...',sub:'Yambi yo eya AI. Buuza kyonna.',hint:'Web AI - Enimi 6 - Tewali kwekalaba',send:'Tuma',search:'Noonya ku mtandao',images:'Noonya ebiwanvu',news:'Amawulire',code:'Noonya code',ai:'AI',
suggests:[{icon:'💼',text:'DeryCode ebalwa ki?'},{icon:'👤',text:'Asiimwe Derick ali ani?'},{icon:'💰',text:'Tovuti egula ssente mmeka?'},{icon:'🌍',text:'Gamba ku Uganda'}]},
rn:{placeholder:'Buuza DeryCode AI ekintu kyona...',sub:'Omutambi wo wa AI. Buuza ekintu kyona.',hint:'Web AI - Endimi 6 - Tihariho kuronda',send:'Ruma',search:'Rondora ku mtandao',images:'Rondora ebiishushani',news:'Amakuru',code:'Rondora code',ai:'AI',
suggests:[{icon:'💼',text:'DeryCode erimu ki?'},{icon:'👤',text:'Asiimwe Derick naiwe?'},{icon:'💰',text:'Webusaiti erimu nkaingana?'},{icon:'🌍',text:'Nkora kuganya ku Uganda'}]},
luo:{placeholder:'Penj DeryCode AI gin mang\'eyo...',sub:'Maromi me AI. Penj gin mang\'eyo.',hint:'Web AI - 5 lok - Pe ki yubo',send:'Cwal',search:'Yiye ku wang kakube',images:'Yiye cal',news:'Yiye lok anywbe',code:'Yiye code',ai:'AI',
suggests:[{icon:'💼',text:'DeryCode miyo gin ma?'},{icon:'👤',text:'Asiimwe Derick en ngani?'},{icon:'💰',text:'Website ni wachne naka?'},{icon:'🌍',text:'Lok kwomi Uganda'}]},
te:{placeholder:'Kopus DeryCode AI aki akongun...',sub:'Ekamolo naikot AI. Kopus akongun.',hint:'Web AI - Aki 5 - Pe itoria',send:'Rukor',search:'Loka koku i internet',images:'Loka ekonere',news:'Amorijingan',code:'Loka code',ai:'AI',
suggests:[{icon:'💼',text:'DeryCode ekai ikaiyese?'},{icon:'👤',text:'Asiimwe Derick eongere?'},{icon:'💰',text:'Webusaiti aroropy Iiyo naka?'},{icon:'🌍',text:'Akanz Uganda'}]}
};
var modeNames=['search','images','news','code','videos'];

inputEl.focus();
inputEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!busy)send()});
inputEl.addEventListener('input',checkWordCount);
renderSuggests();

function renderSuggests(){var lb=langLabels[lang]||langLabels.en;var sc=document.getElementById('suggestCards');sc.innerHTML='';lb.suggests.forEach(function(s){var d=document.createElement('div');d.className='suggest-card';d.onclick=function(){inputEl.value=s.text;send()};d.innerHTML='<div class="suggest-card-icon">'+s.icon+'</div><div class="suggest-card-text">'+s.text+'</div>';sc.appendChild(d)})}

function changeLang(l){lang=l;var lb=langLabels[l]||langLabels.en;inputEl.placeholder=lb.placeholder;document.getElementById('welcomeSub').textContent=lb.sub;document.getElementById('inputHint').textContent=lb.hint;sendBtn.textContent=lb.send;renderSuggests();updateModeLabels();inputEl.focus()}

function updateModeLabels(){var lb=langLabels[lang]||langLabels.en;var labels={search:lb.search,images:lb.images,news:lb.news,code:lb.code};modeNames.forEach(function(m){var btn=document.getElementById('mode-'+m);if(btn){var icon=btn.querySelector('.mi').textContent;btn.innerHTML='<span class="mi">'+icon+'</span> '+labels[m]}})}

function setMode(m){mode=m;modeNames.forEach(function(x){var btn=document.getElementById('mode-'+x);if(btn)btn.className='mode-btn'+(x===m?' active':'')});var lb=langLabels[lang]||langLabels.en;var labels={search:lb.search+'...',images:lb.images+'...',news:lb.news+'...',code:lb.code+'...',videos:(lb.videos||'Search videos')+'...'};inputEl.placeholder=labels[m]||lb.placeholder;inputEl.focus()}

function quickAsk(q){inputEl.value=q;send()}

function checkWordCount(){var w=inputEl.value.trim().split(/\s+/).filter(function(x){return x.length>0}).length;if(w>maxWords){inputEl.style.color='#e85d3a';var remaining=maxWords-w;if(remaining<=-5)inputEl.value=inputEl.value.split(/\s+/).slice(0,maxWords).join(' ')}else{inputEl.style.color=''}}

function send(){
if(busy)return;var q=inputEl.value.trim();if(!q)return;
var w=q.split(/\s+/).filter(function(x){return x.length>0}).length;
if(w>maxWords){alert('Maximum '+maxWords+' words. You used '+w+'.');return}
busy=true;sendBtn.disabled=true;welcomeEl.style.display='none';
messages.push({role:'user',content:q,mode:mode});
renderMessages();inputEl.value='';showTyping();
if(mode==='search'){searchWeb(q)}
else if(mode==='images'){searchImages(q)}
else if(mode==='news'){searchNews(q)}
else if(mode==='code'){searchCode(q)}
else if(mode==='videos'){searchVideos(q)}
}

function askAI(q){
fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:messages.slice(0,-1),lang:lang})})
.then(function(r){return r.json()})
.then(function(data){
if(data.error){messages.push({role:'assistant',content:data.error,mode:'ai'})}else{
messages.push({role:'assistant',content:data.answer,sources:data.sources,followups:data.followups,results:data.results,mode:'ai'})}
renderMessages();busy=false;sendBtn.disabled=false;inputEl.focus()
})
.catch(function(e){messages.push({role:'assistant',content:'Error. Please try again.',mode:'ai'});renderMessages();busy=false;sendBtn.disabled=false})
}

function searchWeb(q){
// Fetch both web results AND AI summary in parallel
Promise.all([
fetch('/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json()}).catch(function(){return{}}),
fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,lang:lang})}).then(function(r){return r.json()}).catch(function(){return{}})
]).then(function(responses){
var searchData=responses[0]||{};
var aiData=responses[1]||{};
var summary=aiData.answer||'';
var sources=[];
// Combine sources from both
if(aiData.sources&&aiData.sources.length>0)sources=aiData.sources;
else if(searchData.results&&searchData.results.length>0)sources=searchData.results.slice(0,5).map(function(r){return{title:r.title,url:r.url}});
var allResults=(searchData.results||[]).concat((aiData.results||[]).filter(function(r){return!(searchData.results||[]).some(function(s){return s.url===r.url})}));
messages.push({role:'assistant',content:summary||'',sources:sources,results:allResults,mode:'search',aiSummary:summary?true:false,confidence:aiData.confidence||'medium'});
renderMessages();busy=false;sendBtn.disabled=false;inputEl.focus()
})
.catch(function(e){messages.push({role:'assistant',content:'Search failed.',mode:'search'});renderMessages();busy=false;sendBtn.disabled=false})
}

function searchImages(q){
fetch('/api/images?q='+encodeURIComponent(q))
.then(function(r){return r.json()})
.then(function(data){
messages.push({role:'assistant',content:'',images:data.images||[],mode:'images'});
renderMessages();busy=false;sendBtn.disabled=false;inputEl.focus()
})
.catch(function(e){messages.push({role:'assistant',content:'Image search failed.',mode:'images'});renderMessages();busy=false;sendBtn.disabled=false})
}

function searchNews(q){
fetch('/api/news?q='+encodeURIComponent(q))
.then(function(r){return r.json()})
.then(function(data){
messages.push({role:'assistant',content:'',articles:data.articles||[],mode:'news'});
renderMessages();busy=false;sendBtn.disabled=false;inputEl.focus()
})
.catch(function(e){messages.push({role:'assistant',content:'News search failed.',mode:'news'});renderMessages();busy=false;sendBtn.disabled=false})
}

function searchCode(q){
fetch('/api/code?q='+encodeURIComponent(q))
.then(function(r){return r.json()})
.then(function(data){
messages.push({role:'assistant',content:'',codeResults:data.results||[],mode:'code'});
renderMessages();busy=false;sendBtn.disabled=false;inputEl.focus()
})
.catch(function(e){messages.push({role:'assistant',content:'Code search failed.',mode:'code'});renderMessages();busy=false;sendBtn.disabled=false})
}

function searchVideos(q){
fetch('/api/videos?q='+encodeURIComponent(q))
.then(function(r){return r.json()})
.then(function(data){
messages.push({role:'assistant',content:'',videos:data.videos||[],mode:'videos'});
renderMessages();busy=false;sendBtn.disabled=false;inputEl.focus()
})
.catch(function(e){messages.push({role:'assistant',content:'Video search failed.',mode:'videos'});renderMessages();busy=false;sendBtn.disabled=false})
}

function renderMessages(){
var html='';
for(var i=0;i<messages.length;i++){
var m=messages[i];
if(m.role==='user'){
var modeIcon={search:'🔍',images:'🖼️',news:'📰',code:'⚡',videos:'📺'}[m.mode||'search']||'🔍';
html+='<div class="msg msg-user"><div class="bubble">'+modeIcon+' '+esc(m.content)+'</div></div>'
}else{
html+='<div class="msg msg-ai"><div class="ai-avatar">DC</div><div class="ai-bubble"><div class="ai-name">DeryCode AI';
if(m.confidence&&m.confidence!=='high'){var cc={high:['High','#4caf50'],medium:['Medium','#ffc107'],low:['Low','#ff9800'],none:['None','#f44336']}[m.confidence]||['Medium','#ffc107'];html+=' <span class="confidence-badge confidence-'+(m.confidence||'medium')+'"><span class="confidence-dot"></span>'+cc[0]+' confidence</span>'}
html+='</div>';

// AI mode
if(m.mode==='ai'||!m.mode){
if(m.content)html+='<div class="ai-content">'+cleanAndEsc(m.content)+'</div>';
if(m.sources&&m.sources.length>0){html+='<div class="ai-sources">';m.sources.forEach(function(s){var url=s.url||'';var title=(s.title||url||'Source');if(title.length>35)title=title.substring(0,32)+'...';html+='<a href="'+url+'" target="_blank" class="ai-source">'+cleanAndEsc(title)+'</a>'});html+='</div>'}
if(m.followups&&m.followups.length>0){html+='<div class="ai-followups">';m.followups.forEach(function(f){html+='<button class="ai-followup" onclick="quickAsk(\''+f.replace(/'/g,"\\'")+'\')">'+esc(f)+'</button>'});html+='</div>'}
if(m.results&&m.results.length>0){html+='<div class="search-section"><div class="search-section-title">Web results</div>';m.results.slice(0,15).forEach(function(r){var c={duckduckgo:'#de5833',wikipedia:'#3366cc',github:'#181717',web:'#3050ff'}[r.engine]||'#444';var l={duckduckgo:'DDG',wikipedia:'Wiki',github:'GH',web:'Web'}[r.engine]||r.engine;html+='<div class="result-card"><div class="result-meta"><span class="engine-badge" style="background:'+c+'">'+l+'</span><span class="result-url">'+formatUrl(r.url)+'</span></div><a href="'+r.url+'" target="_blank" class="result-title">'+cleanAndEsc(r.title)+'</a>';if(r.content)html+='<p class="result-content">'+cleanAndEsc(r.content.substring(0,150))+'</p>';html+='</div>'});html+='</div>'}
}

// Web search mode
if(m.mode==='search'){
if(m.aiSummary&&m.content)html+='<div class="search-section-title" style="margin:0 0 8px;color:var(--gold);font-size:12px;font-weight:600">AI Summary</div>';
if(m.content)html+='<div class="ai-content">'+cleanAndEsc(m.content)+'</div>';
if(m.sources&&m.sources.length>0){html+='<div class="ai-sources">';m.sources.forEach(function(s){var url=s.url||'';var title=(s.title||url||'Source');if(title.length>35)title=title.substring(0,32)+'...';html+='<a href="'+url+'" target="_blank" class="ai-source">'+cleanAndEsc(title)+'</a>'});html+='</div>'}
if(m.results&&m.results.length>0){html+='<div class="search-section"><div class="search-section-title">Web results</div>';m.results.slice(0,15).forEach(function(r){var c={duckduckgo:'#de5833',wikipedia:'#3366cc',github:'#181717',startpage:'#3050ff',web:'#3050ff'}[r.engine]||'#444';var l={duckduckgo:'DDG',wikipedia:'Wiki',github:'GH',startpage:'Web',web:'Web'}[r.engine]||r.engine;html+='<div class="result-card"><div class="result-meta"><span class="engine-badge" style="background:'+c+'">'+l+'</span><span class="result-url">'+formatUrl(r.url)+'</span></div><a href="'+r.url+'" target="_blank" class="result-title">'+cleanAndEsc(r.title)+'</a>';if(r.content)html+='<p class="result-content">'+cleanAndEsc(r.content.substring(0,180))+'</p>';html+='</div>'});html+='</div>'}
}

// Images mode
if(m.mode==='images'){
if(m.images&&m.images.length>0){
html+='<div class="image-grid">';
m.images.forEach(function(img){
html+='<a href="'+(img.image||img.url||img.thumbnail)+'" target="_blank" class="image-card">';
if(img.thumbnail)html+='<img src="'+img.thumbnail+'" loading="lazy" alt="'+esc(img.title||'')+'" onerror="this.style.display=\'none\';this.parentElement.querySelector(\'.image-placeholder\').style.display=\'flex\'"><div class="image-placeholder" style="display:none">🖼️</div>';
else html+='<div class="image-placeholder">🖼️</div>';
if(img.source)html+='<div class="img-source">'+esc(img.source)+'</div>';
html+='<div class="img-overlay">'+esc((img.title||'').substring(0,40))+'</div></a>'
});
html+='</div>';
var lb=langLabels[lang]||langLabels.en;
html+='<div class="ai-followups" style="margin-top:10px"><button class="ai-followup" onclick="quickAsk(\''+esc(m.content||messages[messages.length-2]?.content||'')+'\')">🔄 '+lb.search+'</button></div>';
}else{
html+='<div class="ai-content">No images found. Try different keywords.</div>'
}
}

// News mode
if(m.mode==='news'){
if(m.articles&&m.articles.length>0){
m.articles.forEach(function(a){
html+='<div class="news-card"><div class="news-source"><span class="news-source-name">'+esc(a.source||'News')+'</span>';
if(a.date)html+='<span class="news-date">'+esc(formatDate(a.date))+'</span>';
html+='</div><a href="'+a.url+'" target="_blank" class="news-title">'+cleanAndEsc(a.title)+'</a>';
if(a.content)html+='<p class="news-desc">'+cleanAndEsc(a.content)+'</p>';
html+='</div>'
});
}else{
html+='<div class="ai-content">No news found. Try different keywords.</div>'
}
}

// Code mode
if(m.mode==='code'){
if(m.codeResults&&m.codeResults.length>0){
m.codeResults.forEach(function(r){
var c={duckduckgo:'#de5833',wikipedia:'#3366cc',github:'#181717',web:'#3050ff'}[r.engine]||'#444';
var l={duckduckgo:'DDG',wikipedia:'Wiki',github:'GH',web:'Web'}[r.engine]||r.engine;
html+='<div class="code-card"><div class="code-header"><span class="engine-badge" style="background:'+c+'">'+l+'</span>';
if(r.language)html+='<span class="code-lang">'+esc(r.language)+'</span>';
if(r.stars)html+='<span class="code-stars">⭐ '+r.stars+'</span>';
html+='</div><a href="'+r.url+'" target="_blank" class="code-title">'+esc(r.title)+'</a>';
if(r.content)html+='<p class="code-desc">'+esc(r.content)+'</p>';
html+='</div>'
});
}else{
html+='<div class="ai-content">No code results found.</div>'
}
}

// Videos mode
if(m.mode==='videos'){
if(m.videos&&m.videos.length>0){
html+='<div class="video-list">';
m.videos.forEach(function(v){
var thumb=v.thumbnail||'';
var dur=v.duration?'<span class="vid-duration">'+esc(v.duration)+'</span>':'';
html+='<a href="'+v.url+'" target="_blank" class="video-card">';
html+='<div class="video-thumb">';
if(thumb)html+='<img src="'+thumb+'" loading="lazy" alt="'+esc(v.title)+'" onerror="this.style.display=\'none\'">';
else html+='<div class="image-placeholder">📺</div>';
html+=dur;
html+='</div>';
html+='<div class="video-info"><div class="video-title">'+esc(v.title)+'</div>';
html+='<div class="video-meta">';
if(v.channel)html+='<span class="video-channel">'+esc(v.channel)+'</span>';
if(v.views)html+='<span class="video-views">'+esc(v.views)+'</span>';
if(v.published)html+='<span class="video-date">'+esc(v.published)+'</span>';
html+='</div></div></a>'
});
html+='</div>';
}else{
html+='<div class="ai-content">No videos found. Try different keywords.</div>'
}
}
}

html+='</div></div>'}}
chatEl.innerHTML=html;
requestAnimationFrame(function(){chatEl.scrollTop=chatEl.scrollHeight})
}

function showTyping(){var t=document.createElement('div');t.className='msg msg-ai';t.id='typing';t.innerHTML='<div class="ai-avatar">DC</div><div class="ai-bubble"><div class="ai-name">DeryCode AI</div><div class="typing"><span></span><span></span><span></span></div></div>';chatEl.appendChild(t);chatEl.scrollTop=chatEl.scrollHeight;setTimeout(function(){var tp=document.getElementById('typing');if(tp)tp.remove()},80)}

function startVoice(){try{var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice not supported');return}var rec=new SR();rec.lang=lang==='sw'?'sw-KE':lang==='lg'?'lg-UG':'en-US';rec.continuous=false;rec.interimResults=false;rec.onresult=function(e){inputEl.value=e.results[0][0].transcript;send()};rec.start()}catch(e){}}

function decodeEntities(s){if(!s)return'';var e=document.createElement('div');e.innerHTML=s;return e.textContent||e.innerText||''}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cleanAndEsc(s){if(!s)return'';return esc(decodeEntities(s))}
function formatUrl(u){try{return new URL(u).hostname.replace('www.','')}catch(e){return u}}

// Service Worker Registration
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').then(function(r){
console.log('[PWA] Service Worker registered');
// Force update when new SW is available
r.addEventListener('updatefound',function(){var nw=r.installing;if(nw){nw.addEventListener('statechange',function(){if(nw.state==='activated'&&navigator.serviceWorker.controller){console.log('[PWA] New SW activated, reloading for updates');window.location.reload()}})}})
}).catch(function(e){console.log('[PWA] SW registration failed:',e)})})}

// Install Prompt
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;var banner=document.getElementById('installBanner');if(banner&&!isStandalone())banner.style.display='flex'});
window.addEventListener('appinstalled',function(){var banner=document.getElementById('installBanner');if(banner)banner.style.display='none';deferredPrompt=null;console.log('[PWA] App installed')});

function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}

function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(c){if(c.outcome==='accepted')console.log('[PWA] User accepted install');var banner=document.getElementById('installBanner');if(banner)banner.style.display='none';deferredPrompt=null})}else{alert('To install: tap your browser menu and select "Add to Home Screen" or "Install App"')}}
function dismissInstall(){var b=document.getElementById('installBanner');if(b)b.style.display='none'}

// Read mode from URL
window.addEventListener('load',function(){var p=new URLSearchParams(location.search);if(p.get('mode')&&modeNames.indexOf(p.get('mode'))>=0){setMode(p.get('mode'))}})

function formatDate(d){try{var dt=new Date(d);return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}catch(e){return d}}
</script>
</body>
